kind = "web"
previewPath = "/"
title = "Creative Inventory"
description = "A modern inventory tracking app for an office creatives department material cabinet, with dashboard summaries, searchable inventory, low-stock alerts, stock activity, and database-backed audit records."
version = "1.0.0"
id = "artifacts/creative-inventory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20211

[services.development]
run = "pnpm --filter @workspace/creative-inventory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/creative-inventory", "run", "build" ]
serve = "static"
publicDir = "artifacts/creative-inventory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20211"
BASE_PATH = "/"
